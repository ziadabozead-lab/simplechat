{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Account pending approval</title>
    <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
    <script>
        (function () {
            if (localStorage.getItem('chat-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="container auth">
        <div class="auth-card">
            <h1>Account created</h1>
            <p class="auth-subtext">
                Your account is waiting for an admin to review and approve it.
                You'll be able to log in once that's done.
            </p>
            <p><a href="{% url 'login' %}">Back to login</a></p>
        </div>
    </div>
</body>
</html>
