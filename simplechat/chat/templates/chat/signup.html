{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sign Up</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'chat/favicon.png' %}">
    <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
    <script>
        (function () {
            if (localStorage.getItem('chat-theme') === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="container auth">
        <div class="auth-card auth-card-wide">
            <div class="brand">
                    <defs>
                        <linearGradient id="sparkleGradientSignup" x1="4" y1="4" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="var(--accent)"/>
                            <stop offset="100%" stop-color="var(--gold-bright)"/>
                        </linearGradient>
                    </defs>
                    <path d="M20,3 C21.6,13.2 26.8,18.4 37,20 C26.8,21.6 21.6,26.8 20,37 C18.4,26.8 13.2,21.6 3,20 C13.2,18.4 18.4,13.2 20,3 Z" fill="url(#sparkleGradientSignup)"/>
                    <circle cx="32" cy="9" r="2.6" fill="var(--gold-bright)"/>
                </svg>
                <span class="brand-word">Simple<em>Chat</em></span>
            </div>
            <h1>Create your account</h1>
            <p class="auth-subtext">New accounts are reviewed by an admin before you can log in.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="phone-numbers">
                    <label class="phone-numbers-label">Phone number(s)</label>
                    <div id="phone-rows">
                        <div class="phone-row">
                            <select name="phone_country" class="phone-country">
                                {% for iso2, label in countries %}
                                    <option value="{{ iso2 }}" {% if iso2 == "EG" %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                            <input type="text" name="phone_number" class="phone-number" placeholder="Phone number" inputmode="tel">
                            <button type="button" class="phone-remove" title="Remove">&times;</button>
                        </div>
                    </div>
                    <button type="button" id="add-phone-row" class="add-phone-btn">+ Add another number</button>
                </div>

                <button type="submit">Sign Up</button>
            </form>
            <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
        </div>
    </div>

    <script>
        (function () {
            const rowsWrap = document.getElementById('phone-rows');
            const addBtn = document.getElementById('add-phone-row');
            if (!rowsWrap || !addBtn) return;

            function wireRemove(row) {
                const removeBtn = row.querySelector('.phone-remove');
                removeBtn.addEventListener('click', function () {
                    if (rowsWrap.children.length > 1) {
                        row.remove();
                    } else {
                        row.querySelector('.phone-number').value = '';
                    }
                });
            }

            rowsWrap.querySelectorAll('.phone-row').forEach(wireRemove);

            addBtn.addEventListener('click', function () {
                const first = rowsWrap.querySelector('.phone-row');
                const clone = first.cloneNode(true);
                clone.querySelector('.phone-number').value = '';
                rowsWrap.appendChild(clone);
                wireRemove(clone);
            });
        })();
    </script>
</body>
</html>
