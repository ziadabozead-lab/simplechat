{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Group Chat</title>
    <link rel="stylesheet" href="{% static 'chat/styles.css' %}">
    <script>
        // Apply saved theme before the page paints, so there is no flash
        // of the wrong theme on load.
        (function () {
            var saved = localStorage.getItem('chat-theme');
            if (saved === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>
    <div class="container">
        <div class="topbar">
            <h1>Group Chat</h1>
            <div class="topbar-right">
                <button id="theme-toggle" type="button">
                    <span class="icon">🌙</span> <span class="label">Dark</span>
                </button>
                <form class="logout-form" method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="logout-btn">Logout ({{ user.username }})</button>
                </form>
            </div>
        </div>

        <div id="chat-box">
            {% for m in messages %}
                <div class="msg {% if m.sender == user.username %}me{% else %}them{% endif %}" data-id="{{ m.id }}" data-sender="{{ m.sender }}">
                    {% if m.sender != user.username %}<div class="sender">{{ m.sender }}</div>{% endif %}
                    <div class="text">{{ m.text }}</div>
                    <div class="time">{{ m.created_at|time:"H:i" }}</div>
                </div>
            {% endfor %}
        </div>

        <form id="send-form">
            {% csrf_token %}
            <input type="text" id="text-input" placeholder="Write a message" autocomplete="off">
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        // Values Django needs to hand to the external JS file.
        const LOGIN_URL = "{% url 'login' %}";
        const LAST_ID = {% if messages %}{{ messages.last.id }}{% else %}0{% endif %};
    </script>
    <script src="{% static 'chat/room.js' %}"></script>
</body>
</html>
